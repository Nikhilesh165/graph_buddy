<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Graph Buddy</title>
    <!-- Resolve the theme before first paint so dark-mode users never see a
         light flash. Mirrors lib/ThemeProvider.tsx (same storage key and
         resolution rule); keep the two in step. -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('graph-buddy:theme')
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
